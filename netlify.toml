# Netlify configuration for FieldNote PWA

[build]
  command = "npm run build"
  publish = "dist"

  [build.environment]
    NODE_VERSION = "20"

# SPA fallback — all paths serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Service worker — must never be cached so updates propagate immediately
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/workbox-*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Long-cache hashed bundles (Vite adds content hash to filenames)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
